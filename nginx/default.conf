server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
